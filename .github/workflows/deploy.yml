name: CI/CD Production Build & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Type Checking & Production Build
      run: npm run build

    - name: Verify Build Artifacts
      run: |
        test -f dist/index.html || exit 1
        echo "Production bundle verified successfully."
